version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    groups:
      tailwind-tooling:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      quality-tooling:
        patterns:
          - c8
          - eslint
          - '@eslint/*'
          - globals
          - prettier

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
