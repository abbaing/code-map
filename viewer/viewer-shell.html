<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Map</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/tailwind.css" />
    <link rel="stylesheet" href="/viewer.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="app-sidebar" aria-label="Primary navigation">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none">
              <rect x="2.5" y="7.5" width="5" height="5" rx="1" />
              <rect x="12.5" y="2.5" width="5" height="5" rx="1" />
              <rect x="12.5" y="12.5" width="5" height="5" rx="1" />
              <path d="M7.5 9 12.5 5M7.5 11l5 4" />
            </svg>
          </div>
          <div class="brand-copy">
            <strong>Code Map</strong>
            <span id="projectName">Architecture explorer</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-group">
            <p class="nav-label">Workspace</p>
            <button id="tabOverview" class="nav-item active">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="3" y="3" width="5" height="5" rx="1" />
                <rect x="12" y="3" width="5" height="5" rx="1" />
                <rect x="3" y="12" width="5" height="5" rx="1" />
                <rect x="12" y="12" width="5" height="5" rx="1" />
              </svg>
              <span>Overview</span>
            </button>
          </div>

          <div class="nav-group">
            <p class="nav-label">Explore</p>
            <button id="tabGraph" class="nav-item">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="5" cy="10" r="2" />
                <circle cx="15" cy="5" r="2" />
                <circle cx="15" cy="15" r="2" />
                <path d="M7 9l6-3M7 11l6 3" />
              </svg>
              <span>Graph</span>
            </button>
            <button id="tabDomain" class="nav-item">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M3 5.5 10 2l7 3.5-7 3.5-7-3.5Z" />
                <path d="m3 10 7 3.5 7-3.5M3 14.5 10 18l7-3.5" />
              </svg>
              <span>Domain model</span>
            </button>
          </div>

          <div class="nav-group">
            <p class="nav-label">Quality</p>
            <button id="tabFindings" class="nav-item">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M10 2.5 18 17H2L10 2.5Z" />
                <path d="M10 7v4.5M10 14.5v.1" />
              </svg>
              <span>Findings</span>
              <span id="sidebarFindingsCount" class="nav-count">0</span>
            </button>
          </div>
        </nav>

        <div class="sidebar-footer">
          <button id="tabSettings" class="nav-item">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="3" />
              <path
                d="M16 10a6 6 0 0 0-.1-1l1.6-1.2-1.5-2.6-1.9.8a6 6 0 0 0-1.7-1L12.2 3h-3l-.3 2
                  a6 6 0 0 0-1.7 1l-1.9-.8-1.5 2.6L5.4 9a6 6 0 0 0 0 2l-1.6 1.2 1.5 2.6 1.9-.8
                  a6 6 0 0 0 1.7 1l.3 2h3l.3-2a6 6 0 0 0 1.7-1l1.9.8 1.5-2.6L15.9 11a6 6 0 0 0 .1-1Z"
              />
            </svg>
            <span>Settings</span>
          </button>
          <button id="metaPill" class="report-button">
            <span class="report-dot"></span>
            <span>Latest report</span>
          </button>
        </div>
      </aside>
